[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-evolution"
version = "0.1.0"
description = "Reproducible Git history and Python AST evolution analysis"
requires-python = ">=3.11"
dependencies = ["SQLAlchemy>=2.0,<3", "pandas>=2.0,<4", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
repo-evolution = "repo_evolution.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
